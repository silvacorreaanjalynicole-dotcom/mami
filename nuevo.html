<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día Mamá</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Great Vibes', cursive;
            background-color: #fce4ec;
            text-align: center;
            padding: 50px;
        }
        .snoopy {
            width: 200px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .message {
            color: #d81b60;
            font-size: 36px;
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <img class="snoopy" src="snoopy.png" alt="Snoopy">
    <div class="message">
        Feliz Día Mamá<br>
        Gracias por asumir con tanto amor y valentía el papel de padre y madre a la vez.<br>
        Mi vida está completa porque nunca te faltó fuerza para darme todo.<br>
        Te amo.
    </div>
</body>
</html>
